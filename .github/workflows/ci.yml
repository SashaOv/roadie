name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # 73e4699
        with:
          version: 10.33.0
          standalone: true

      - run: pnpm --version

      # The hosted images' preinstalled rustup and stable toolchain serve the
      # Cargo tests.
      - run: uv sync
      - run: uv run roadie checks
