name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is suspended until its tests are fixed on a Windows machine.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # 73e4699
        with:
          version: 10.33.0
          standalone: true

      - run: pnpm --version

      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y strace

      - if: matrix.os == 'ubuntu-latest'
        run: strace -f -qq -xx -y --seccomp-bpf --kill-on-exit -e trace=open,openat,openat2 -e status=successful -o trace.log python3 -c "open('pyproject.toml').read()"

      - if: matrix.os == 'ubuntu-latest'
        run: |
          python3 - << 'PY'
          import pathlib, re, sys
          text = pathlib.Path("trace.log").read_text(errors="surrogateescape")
          decoded = re.sub(r"\\x([0-9a-fA-F]{2})", lambda m: chr(int(m.group(1), 16)), text)
          candidates = re.findall(r"= \d+<([^>]+)>", decoded)
          sys.exit(0 if any(c.endswith("/pyproject.toml") for c in candidates) else 1)
          PY

      # The hosted images' preinstalled rustup and stable toolchain serve the
      # Cargo tests.
      - run: uv sync
      - run: uv run roadie checks
