[project]
name = "roadie"
version = "0.1.2"
description = "Wire up multi-language, incremental builds in a few lines of Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=4.20.0,<5.0.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.1,<2.0.0",
]

[project.scripts]
roadie = "roadie.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadie"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
testpaths = ["tests"]
# pytest's default skips directories named `build`, which tests/build mirrors.
norecursedirs = [".*", "*.egg", "__pycache__", "dist", "node_modules", "venv"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.per-file-ignores]
"src/roadie/system/**" = ["TID251"]
"tests/support.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.platform".msg = "use roadie.system"
"os.name".msg = "use roadie.system"
"platform.system".msg = "use roadie.system"
"msvcrt".msg = "use roadie.system"
"fcntl".msg = "use roadie.system"
"termios".msg = "use roadie.system"
"pty".msg = "use roadie.system"
"winreg".msg = "use roadie.system"
"os.killpg".msg = "use roadie.system"
"os.getpgid".msg = "use roadie.system"
"os.setsid".msg = "use roadie.system"
"signal.SIGKILL".msg = "use roadie.system"
